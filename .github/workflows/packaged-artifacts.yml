name: Packaged application artifacts

on:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: noktus-windows-x64
          - os: macos-15
            artifact: noktus-macos-arm64
          - os: macos-15-intel
            artifact: noktus-macos-x64
          - os: ubuntu-22.04
            artifact: noktus-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run package:dir
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/Noktus-*
          if-no-files-found: error
          retention-days: 14
